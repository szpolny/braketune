[package]
name = "braketune"
version = "0.3.0"
description = "Brake force control for Fanatec pedals"
authors = ["szpolny"]
edition = "2024"
license = "MIT"
repository = "https://github.com/szpolny/braketune"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
# xattr 0.2 (via GPUI) uses ENOATTR, removed from newer libc releases.
libc = "=0.2.186"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evdev = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
