[package]
name = "braketune"
version = "0.2.0"
description = "Brake force control for Fanatec pedals"
authors = ["szpolny"]
edition = "2021"
license = "MIT"
repository = "https://github.com/szpolny/braketune"

[lib]
name = "braketune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dependencies.hidapi]
version = "2"
default-features = false
features = ["linux-native"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
