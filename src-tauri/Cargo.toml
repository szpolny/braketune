[package]
name = "braketune"
version = "0.1.0"
description = "Brake force control for Fanatec pedals"
authors = ["szpolny"]
edition = "2021"
license = "MIT"
repository = "https://github.com/szpolny/braketune"

[lib]
name = "braketune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evdev = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
