name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libudev-dev
      - run: cargo build --release --locked
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Package deb and rpm
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          export VERSION="${TAG#v}"
          mkdir -p dist
          nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
          nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          curl --fail --location --output /tmp/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy
          cp assets/icon.png /tmp/braketune.png
          /tmp/linuxdeploy --appdir AppDir --executable target/release/braketune --desktop-file packaging/braketune.desktop --icon-file /tmp/braketune.png --library /usr/lib/x86_64-linux-gnu/libfontconfig.so.1 --library /usr/lib/x86_64-linux-gnu/libvulkan.so.1 --library /usr/lib/x86_64-linux-gnu/libwayland-client.so.0 --output appimage
          mv ./*.AppImage dist/
      - name: Upload release packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*
